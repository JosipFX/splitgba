<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ln-bg" x1="48" y1="0" x2="604" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121D1F"/>
      <stop offset=".55" stop-color="#0B1218"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <linearGradient id="ln-node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#26383D"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <radialGradient id="ln-core" cx="0" cy="0" r="1" gradientTransform="translate(320 160) rotate(90) scale(72)">
      <stop stop-color="#B7F56A" stop-opacity=".3"/>
      <stop offset="1" stop-color="#B7F56A" stop-opacity="0"/>
    </radialGradient>
    <filter id="ln-shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#02050A" flood-opacity=".65"/>
    </filter>
    <filter id="ln-glow" x="-100%" y="-100%" width="300%" height="300%">
