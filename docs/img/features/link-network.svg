    .ln-packet-d { animation-delay: -2.03s; }
    .ln-core-ring { animation: ln-ring 2.7s ease-out infinite; transform-origin: 320px 160px; }
    .ln-led { animation: ln-led 1.8s ease-in-out infinite; }
    @keyframes ln-packet { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @keyframes ln-ring { 0% { transform: scale(.55); opacity: .9; } 85%,100% { transform: scale(1.35); opacity: 0; } }
    @keyframes ln-led { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ln-packet,.ln-core-ring,.ln-led { animation: none; } }
  </style>

