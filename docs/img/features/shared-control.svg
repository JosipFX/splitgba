<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="sc-bg" x1="30" y1="0" x2="610" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20161D"/>
      <stop offset=".5" stop-color="#10131A"/>
      <stop offset="1" stop-color="#090C12"/>
    </linearGradient>
    <linearGradient id="sc-panel" x1="135" y1="51" x2="502" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#222A37"/>
      <stop offset="1" stop-color="#101620"/>
    </linearGradient>
    <linearGradient id="sc-spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#75E7FF"/>
      <stop offset=".34" stop-color="#B7F56A"/>
      <stop offset=".67" stop-color="#FFC96B"/>
      <stop offset="1" stop-color="#FF7781"/>
    </linearGradient>
    <radialGradient id="sc-halo" cx="0" cy="0" r="1" gradientTransform="translate(320 160) rotate(90) scale(150 270)">
      <stop stop-color="#FF7781" stop-opacity=".11"/>
      <stop offset="1" stop-color="#FF7781" stop-opacity="0"/>
    </radialGradient>
    <filter id="sc-shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#02050A" flood-opacity=".7"/>
    </filter>
    <filter id="sc-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="sc-wave-clip">
      <rect x="190" y="81" width="260" height="72" rx="10"/>
    </clipPath>
  </defs>
  <style>
    .sc-wave { animation: sc-wave 3.8s linear infinite; }
    .sc-cursor { animation: sc-slide 4.2s cubic-bezier(.65,0,.35,1) infinite; }
    .sc-flash { animation: sc-flash 4.2s ease-out infinite; transform-origin: 320px 222px; }
    .sc-segment { animation: sc-segment 2.4s ease-in-out infinite; }
    @keyframes sc-wave { to { transform: translateX(-104px); } }
    @keyframes sc-slide { 0%,12% { transform: translateX(0); } 33% { transform: translateX(64px); } 55% { transform: translateX(128px); } 77%,100% { transform: translateX(192px); } }
    @keyframes sc-flash { 0%,72% { transform: scale(.7); opacity: 0; } 77% { opacity: .85; } 92%,100% { transform: scale(1.25); opacity: 0; } }
    @keyframes sc-segment { 0%,100% { opacity: .3; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .sc-wave,.sc-cursor,.sc-flash,.sc-segment { animation: none; } }
  </style>

  <rect width="640" height="320" rx="24" fill="url(#sc-bg)"/>
  <rect width="640" height="320" rx="24" fill="url(#sc-halo)"/>
  <path d="M40 56H600M40 264H600M96 24V296M544 24V296" stroke="#FF7781" stroke-opacity=".045"/>
  <path d="M109 160h50M481 160h50" stroke="#A5C2E0" stroke-opacity=".15" stroke-dasharray="3 6"/>
  <circle cx="320" cy="160" r="135" stroke="#FF7781" stroke-opacity=".055"/>

  <g filter="url(#sc-shadow)">
    <rect x="164" y="52" width="312" height="222" rx="25" fill="url(#sc-panel)" stroke="#A5C2E0" stroke-opacity=".25"/>
    <rect x="177" y="65" width="286" height="196" rx="17" fill="#0A0E15" stroke="#A5C2E0" stroke-opacity=".12"/>

    <g clip-path="url(#sc-wave-clip)">
      <rect x="190" y="81" width="260" height="72" rx="10" fill="#0E151D"/>
      <g class="sc-wave">
        <path d="M170 117h22l9-19 14 39 14-57 14 74 14-53 14 29 14-13h22l9-19 14 39 14-57 14 74 14-53 14 29 14-13h22l9-19 14 39 14-57 14 74 14-53 14 29 14-13h22" stroke="url(#sc-spectrum)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M170 117h22l9-19 14 39 14-57 14 74 14-53 14 29 14-13h22l9-19 14 39 14-57 14 74 14-53 14 29 14-13h22l9-19 14 39 14-57 14 74 14-53 14 29 14-13h22" stroke="url(#sc-spectrum)" stroke-opacity=".25" stroke-width="8" filter="url(#sc-glow)"/>
      </g>
    </g>

    <path d="M206 184h228" stroke="#A5C2E0" stroke-opacity=".18" stroke-width="2" stroke-linecap="round"/>
    <g>
      <path d="M206 178v12M270 178v12M334 178v12M398 178v12" stroke="#A5C2E0" stroke-opacity=".36" stroke-width="2" stroke-linecap="round"/>
      <circle class="sc-segment" cx="206" cy="184" r="6" fill="#75E7FF"/>
      <circle class="sc-segment" cx="270" cy="184" r="6" fill="#B7F56A" style="animation-delay:-.6s"/>
      <circle class="sc-segment" cx="334" cy="184" r="6" fill="#FFC96B" style="animation-delay:-1.2s"/>
      <circle class="sc-segment" cx="398" cy="184" r="6" fill="#FF7781" style="animation-delay:-1.8s"/>
      <g class="sc-cursor">
        <path d="M200 166h12l5 8-5 8h-12l-5-8 5-8Z" fill="#F4F7FB"/>
        <circle cx="206" cy="174" r="3" fill="#101620"/>
      </g>
    </g>

    <circle class="sc-flash" cx="320" cy="222" r="34" stroke="#FF7781" stroke-opacity=".7"/>
    <rect x="293" y="204" width="54" height="37" rx="10" fill="#171C26" stroke="#FF7781" stroke-opacity=".55"/>
    <path d="M306 204l5-7h18l5 7" stroke="#FFA2A9" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="320" cy="222" r="10" fill="#0A0E15" stroke="#FFA2A9" stroke-opacity=".75" stroke-width="2"/>
    <circle cx="320" cy="222" r="4" fill="#FF7781"/>
    <circle cx="338" cy="212" r="2.5" fill="#FFC96B"/>
  </g>

  <g filter="url(#sc-shadow)">
    <path d="M72 129h56c10 0 18 8 18 18v27c0 10-8 18-18 18H72c-10 0-18-8-18-18v-27c0-10 8-18 18-18Z" fill="#141C26" stroke="#75E7FF" stroke-opacity=".4"/>
    <path d="M75 160h17M83.5 151.5v17" stroke="#B8F5FF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="119" cy="153" r="4" fill="#75E7FF" fill-opacity=".8"/>
    <circle cx="128" cy="163" r="4" fill="#75E7FF" fill-opacity=".45"/>
    <path d="M146 160h18" stroke="#75E7FF" stroke-opacity=".38"/>

    <path d="M512 129h56c10 0 18 8 18 18v27c0 10-8 18-18 18h-56c-10 0-18-8-18-18v-27c0-10 8-18 18-18Z" fill="#21161D" stroke="#FF7781" stroke-opacity=".45"/>
    <path d="M515 160h17M523.5 151.5v17" stroke="#FFA2A9" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="559" cy="153" r="4" fill="#FF7781" fill-opacity=".8"/>
    <circle cx="568" cy="163" r="4" fill="#FF7781" fill-opacity=".45"/>
    <path d="M476 160h18" stroke="#FF7781" stroke-opacity=".38"/>
  </g>

  <path d="M100 213c42 47 88 69 139 77M540 213c-42 47-88 69-139 77" stroke="#A5C2E0" stroke-opacity=".08" stroke-dasharray="3 8"/>
</svg>
