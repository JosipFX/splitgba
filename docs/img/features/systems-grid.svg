<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="sg-bg" x1="74" y1="18" x2="570" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172333"/>
      <stop offset="1" stop-color="#0A0F17"/>
    </linearGradient>
    <linearGradient id="sg-frame" x1="190" y1="40" x2="444" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30435A"/>
      <stop offset="1" stop-color="#151E2B"/>
    </linearGradient>
    <linearGradient id="sg-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B8F5FF"/>
      <stop offset="1" stop-color="#4BC8F2"/>
    </linearGradient>
    <linearGradient id="sg-lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D8FF9E"/>
      <stop offset="1" stop-color="#8ED84E"/>
    </linearGradient>
    <linearGradient id="sg-amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE5A1"/>
      <stop offset="1" stop-color="#F3AC4F"/>
    </linearGradient>
    <linearGradient id="sg-coral" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFA2A9"/>
      <stop offset="1" stop-color="#E85768"/>
    </linearGradient>
    <radialGradient id="sg-halo" cx="0" cy="0" r="1" gradientTransform="translate(320 153) rotate(90) scale(150 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75E7FF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#75E7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sg-shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#02040A" flood-opacity=".62"/>
    </filter>
    <filter id="sg-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="sg-screen-clip">
      <rect x="184" y="35" width="272" height="204" rx="19"/>
    </clipPath>
  </defs>
  <style>
    .sg-scan { animation: sg-scan 5.5s ease-in-out infinite; }
    .sg-device { animation: sg-float 5s ease-in-out infinite; }
    .sg-device:nth-of-type(2) { animation-delay: -1.7s; }
    .sg-device:nth-of-type(3) { animation-delay: -3.3s; }
    .sg-led { animation: sg-pulse 2.8s ease-in-out infinite; }
    @keyframes sg-scan { 0%,100% { transform: translateY(-25px); opacity: 0; } 18%,78% { opacity: .45; } 55% { transform: translateY(205px); } }
    @keyframes sg-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes sg-pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sg-scan,.sg-device,.sg-led { animation: none; } }
  </style>

  <rect width="640" height="320" rx="24" fill="url(#sg-bg)"/>
  <rect width="640" height="320" rx="24" fill="url(#sg-halo)"/>
  <path d="M38 74H602M38 246H602M116 24V296M524 24V296" stroke="#A5C2E0" stroke-opacity=".055"/>
  <circle cx="320" cy="158" r="132" stroke="#75E7FF" stroke-opacity=".08"/>
  <circle cx="320" cy="158" r="105" stroke="#75E7FF" stroke-opacity=".055"/>

