    <circle cx="410" cy="258" r="5" fill="#FFC96B" fill-opacity=".4"/>
    <path d="M293 252h54" stroke="#FFC96B" stroke-opacity=".36"/>
    <path d="M307 264h26" stroke="#FFC96B" stroke-opacity=".2"/>
  </g>
</svg>
