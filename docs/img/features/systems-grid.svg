      <path d="m343 220 18-39 21 20 23-42 33 61h-95Z" fill="url(#sg-coral)" fill-opacity=".24"/>
      <path class="sg-scan" d="M184 45h272v25H184z" fill="url(#sg-cyan)" opacity=".25"/>
      <circle class="sg-led" cx="300" cy="52" r="2.5" fill="#75E7FF"/>
