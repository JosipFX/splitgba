      <circle class="sg-led" cx="300" cy="155" r="2.5" fill="#FFC96B" style="animation-delay:-1.4s"/>
      <circle class="sg-led" cx="438" cy="155" r="2.5" fill="#FF7781" style="animation-delay:-2.1s"/>
    </g>
    <path d="M298 254h44l8 16h-60l8-16Z" fill="#111925" stroke="#8198B2" stroke-opacity=".25"/>
    <rect x="275" y="269" width="90" height="9" rx="4.5" fill="#1B2735" stroke="#8FA8C4" stroke-opacity=".25"/>
  </g>

  <ellipse cx="320" cy="286" rx="180" ry="15" fill="#02050A" opacity=".62" filter="url(#sg-soft)"/>

  <g class="sg-device" filter="url(#sg-shadow)">
