    <rect x="101" y="185" width="47" height="28" rx="5" fill="#070C12" stroke="#7CE8FF" stroke-opacity=".32"/>
    <rect x="107" y="190" width="35" height="18" rx="2" fill="url(#sg-cyan)" fill-opacity=".19"/>
