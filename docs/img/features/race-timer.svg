<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="rt-bg" x1="22" y1="8" x2="614" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#211B14"/>
      <stop offset=".48" stop-color="#11141A"/>
      <stop offset="1" stop-color="#090C12"/>
    </linearGradient>
    <linearGradient id="rt-track" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFC96B" stop-opacity=".04"/>
      <stop offset=".65" stop-color="#FFC96B" stop-opacity=".17"/>
      <stop offset="1" stop-color="#FFC96B" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="rt-podium" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2B251B"/>
      <stop offset="1" stop-color="#11151C"/>
    </linearGradient>
    <radialGradient id="rt-halo" cx="0" cy="0" r="1" gradientTransform="translate(482 150) rotate(90) scale(128)">
      <stop stop-color="#FFC96B" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFC96B" stop-opacity="0"/>
    </radialGradient>
    <filter id="rt-shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#02050A" flood-opacity=".65"/>
    </filter>
    <filter id="rt-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <style>
    .rt-runner-a { animation: rt-run 4.8s ease-in-out infinite; }
    .rt-runner-b { animation: rt-run 4.8s .22s ease-in-out infinite; }
    .rt-runner-c { animation: rt-run 4.8s .44s ease-in-out infinite; }
    .rt-runner-d { animation: rt-run 4.8s .66s ease-in-out infinite; }
    .rt-hand { animation: rt-tick 3s steps(30) infinite; transform-origin: 482px 150px; }
    .rt-pulse { animation: rt-pulse 2s ease-out infinite; transform-origin: 482px 150px; }
    @keyframes rt-run { 0%,10% { transform: translateX(-12px); } 55%,100% { transform: translateX(255px); } }
    @keyframes rt-tick { to { transform: rotate(360deg); } }
    @keyframes rt-pulse { 0% { transform: scale(.72); opacity: .7; } 90%,100% { transform: scale(1.18); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rt-runner-a,.rt-runner-b,.rt-runner-c,.rt-runner-d,.rt-hand,.rt-pulse { animation: none; } }
  </style>

  <rect width="640" height="320" rx="24" fill="url(#rt-bg)"/>
  <rect width="640" height="320" rx="24" fill="url(#rt-halo)"/>
  <path d="M44 48H596M44 272H596M93 24V296M547 24V296" stroke="#FFC96B" stroke-opacity=".045"/>

  <g transform="translate(55 78)">
    <rect width="354" height="164" rx="21" fill="#0B0F15" stroke="#A5C2E0" stroke-opacity=".17"/>
    <path d="M0 41h354M0 82h354M0 123h354" stroke="#A5C2E0" stroke-opacity=".13"/>
    <path d="M67 0v164M291 0v164" stroke="#FFC96B" stroke-opacity=".12" stroke-dasharray="4 7"/>
    <path d="M0 0h354v41H0zM0 82h354v41H0z" fill="url(#rt-track)"/>
    <path d="M293 0v164" stroke="#FFE5A1" stroke-opacity=".4" stroke-width="2"/>
    <path d="m298 0 8 8-8 8 8 8-8 8 8 8-8 8 8 8-8 8 8 8-8 8 8 8-8 8 8 8-8 8 8 8-8 8 8 8-8 8" stroke="#FFE5A1" stroke-opacity=".18"/>

    <g class="rt-runner-a" transform="translate(25 20)">
      <circle r="11" fill="#13242B" stroke="#75E7FF" stroke-opacity=".75"/>
      <path d="m-4 0 3 3 6-7" stroke="#B8F5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-14 14h28" stroke="#75E7FF" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="rt-runner-b" transform="translate(25 61)">
      <circle r="11" fill="#1B2617" stroke="#B7F56A" stroke-opacity=".75"/>
      <path d="m-4 0 3 3 6-7" stroke="#D8FF9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-14 14h28" stroke="#B7F56A" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="rt-runner-c" transform="translate(25 102)">
      <circle r="11" fill="#2A2113" stroke="#FFC96B" stroke-opacity=".75"/>
      <path d="m-4 0 3 3 6-7" stroke="#FFE5A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-14 14h28" stroke="#FFC96B" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="rt-runner-d" transform="translate(25 143)">
      <circle r="11" fill="#28151B" stroke="#FF7781" stroke-opacity=".75"/>
      <path d="m-4 0 3 3 6-7" stroke="#FFA2A9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-14 14h28" stroke="#FF7781" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <g filter="url(#rt-shadow)">
    <circle class="rt-pulse" cx="482" cy="150" r="79" stroke="#FFC96B" stroke-opacity=".42"/>
    <circle cx="482" cy="150" r="70" fill="#11151B" stroke="#FFC96B" stroke-opacity=".55"/>
    <circle cx="482" cy="150" r="57" fill="url(#rt-podium)" stroke="#FFE5A1" stroke-opacity=".18"/>
    <path d="M482 82v9M482 209v9M414 150h9M541 150h9M434 102l7 7M523 191l7 7M434 198l7-7M523 109l7-7" stroke="#FFE5A1" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
    <path d="M482 150V107" stroke="#FFE5A1" stroke-opacity=".23" stroke-width="7" stroke-linecap="round" filter="url(#rt-glow)"/>
    <path class="rt-hand" d="M482 150V107" stroke="#FFE5A1" stroke-width="3" stroke-linecap="round"/>
    <circle cx="482" cy="150" r="8" fill="#FFC96B"/>
    <circle cx="482" cy="150" r="3" fill="#17120A"/>
    <path d="M458 62h48M470 51h24v11h-24z" fill="#181B20" stroke="#FFC96B" stroke-opacity=".5"/>
  </g>

  <g transform="translate(430 245)">
    <path d="M0 31h34V8h34v13h34v32H0V31Z" fill="#11151B" stroke="#FFC96B" stroke-opacity=".3"/>
    <path d="M0 31h34V8M34 31v22M34 21h34v32M68 21h34" stroke="#FFE5A1" stroke-opacity=".19"/>
    <circle cx="17" cy="22" r="6" fill="#75E7FF" fill-opacity=".7"/>
    <circle cx="51" cy="12" r="6" fill="#FFC96B" fill-opacity=".85"/>
    <circle cx="85" cy="31" r="6" fill="#FF7781" fill-opacity=".7"/>
  </g>
</svg>
